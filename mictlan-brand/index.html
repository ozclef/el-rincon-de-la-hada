<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Mictlan Burger — Demo visual</title>
<style>
  :root{
    --r: 255; --g: 100; --b: 180; /* color base (pink alebrije) */
    --accent: rgba(var(--r),var(--g),var(--b),1);
    --glow: 0 8px 30px rgba(var(--r),var(--g),var(--b),0.25);
    --bg1: #0b3a2e; /* deep jungle */
    --bg2: #365e3f;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,'Helvetica Neue',Arial}
  body{background:linear-gradient(180deg,var(--bg1),var(--bg2));color:#f7f7f7;display:flex;align-items:center;justify-content:center;padding:40px}

  /* contenedor central */
  .stage{width:100%;max-width:1100px;border-radius:18px;padding:30px;background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(0,0,0,0.12));backdrop-filter: blur(6px);box-shadow:var(--glow);position:relative;overflow:hidden}

  /* header */
  .brand{display:flex;align-items:center;gap:18px}
  .logo-sigil{width:88px;height:88px;border-radius:16px;background:radial-gradient(circle at 30% 20%,rgba(var(--r),var(--g),var(--b),0.18),transparent 30%), linear-gradient(135deg,#123 5%, #345 60%);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:22px;box-shadow:var(--glow)}
  .brand h1{margin:0;font-size:28px}
  .brand p{margin:0;opacity:0.9}

  /* panel con hada e ilustración */
  .canvas{display:grid;grid-template-columns:420px 1fr;gap:24px;margin-top:20px}
  .card{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));padding:18px;border-radius:14px}

  /* estilo de la 'hada' con SVG simplificado */
  .fairy-wrap{display:flex;align-items:center;flex-direction:column;gap:12px}
  .fairy-figure{width:320px;height:320px;border-radius:12px;display:flex;align-items:center;justify-content:center;position:relative}
  .fairy-figure svg{width:84%;height:84%}

  /* burger showcase */
  .burger{display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px}
  .burger .patty{width:220px;height:120px; border-radius:18px;background:linear-gradient(180deg,#6b2f1b,#4a1f14);box-shadow:inset 0 -6px 12px rgba(0,0,0,0.4);position:relative}
  .bun{position:absolute;left:50%;transform:translateX(-50%);width:260px;height:70px;border-radius:40px;background:linear-gradient(180deg,#f9c57a,#d78d2b);top:-30px;box-shadow:var(--glow)}
  .burger:hover .bun{transform:translateX(-50%) translateY(-6px) scale(1.02)}

  /* RGB rim glow for accents */
  .accent-btn{padding:10px 16px;border-radius:10px;border:none;background:linear-gradient(90deg, rgba(var(--r),var(--g),var(--b),0.95), rgba(var(--r),var(--g),var(--b),0.6));color:#111;font-weight:700;cursor:pointer;box-shadow:0 6px 24px rgba(var(--r),var(--g),var(--b),0.18)}

  /* fireflies */
  .firefly{position:absolute;width:8px;height:8px;border-radius:50%;background:rgba(255,240,150,0.95);box-shadow:0 0 12px rgba(255,240,150,0.6);opacity:0;animation:float 6s infinite ease-in-out}
  @keyframes float{0%{transform:translateY(0) translateX(0);opacity:0}10%{opacity:1}50%{transform:translateY(-40px)}90%{opacity:0}}

  /* menu list */
  .menu{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .menu .item{padding:10px;border-radius:10px;background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(0,0,0,0.06));display:flex;flex-direction:column;gap:6px}
  .menu strong{font-size:14px}
  .meta{font-size:12px;opacity:0.85}

  /* small responsive */
  @media(max-width:880px){.canvas{grid-template-columns:1fr} .fairy-figure{width:260px;height:260px}}
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="brand">
      <div class="logo-sigil">MB</div>
      <div>
        <h1>Mictlan Burger</h1>
        <p>Mexican flavor. Tlaxcalteca soul.</p>
      </div>
    </div>

    <div class="canvas">
      <div class="card fairy-wrap">
        <div class="fairy-figure" id="fairy">
          <!-- SVG simplificado, puedes reemplazarlo por tu arte posteriormente -- >
          <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" id="svgFairy">-->
          <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" id="svgFairy">
            <defs>
              <linearGradient id="g1" x1="0" x2="1"><stop offset="0" stop-color="#ff7ab6"/><stop offset="1" stop-color="#8b3cff"/></linearGradient>
            </defs>
            <g transform="translate(0,0)">
              <!-- wings (alebrije style patterns) -->
              <g opacity="0.95">
                <path d="M120 240 C40 120, 40 360, 160 280 C220 240, 200 240, 120 240 Z" fill="#075f94" transform="translate(60,0) scale(1.2)"/>
                <path d="M392 240 C472 120, 472 360, 352 280 C292 240, 312 240, 392 240 Z" fill="#0b6f74" transform="translate(-60,0) scale(1.2)"/>
              </g>
              <!-- body and face -->
              <circle cx="256" cy="220" r="56" fill="#ffd9e6" stroke="#000" stroke-opacity="0.06"/>
              <ellipse cx="256" cy="330" rx="92" ry="60" fill="#2b8a4a" />
              <!-- hair -->
              <path d="M190 200 C180 120, 330 110, 320 200 C300 260, 200 260, 190 200 Z" fill="url(#g1)"/>
              <!-- burger icon small -->
              <g transform="translate(200,360) scale(0.9)">
                <rect x="-40" y="-36" width="120" height="24" rx="12" fill="#f6c57a" />
                <rect x="-36" y="-20" width="112" height="16" rx="8" fill="#3a2b1f" />
              </g>
            </g>
          </svg>
        </div>
        <button class="accent-btn" id="rgbToggle">Loop RGB</button>
      </div>

      <div class="card">
        <div class="burger">
          <div class="bun" aria-hidden></div>
          <div class="patty" aria-hidden></div>
          <div style="width:100%;text-align:center;margin-top:12px">
            <button class="accent-btn" id="order">Order "La Michileposhtli"</button>
          </div>
        </div>

        <div style="margin-top:18px">
          <h3 style="margin:0 0 8px 0">Menu</h3>
          <div class="menu" id="menu">
            <div class="item"><strong>La Michileposhtli</strong><div class="meta">Burger: nopal, achiote shrimp, mole-lime mayo</div></div>
            <div class="item"><strong>Nopal Smash</strong><div class="meta">Smash patty, charred nopales, queso asado</div></div>
            <div class="item"><strong>Chili En Nogada Burger</strong><div class="meta">Seasonal special — walnut crema, pomegranate</div></div>
            <div class="item"><strong>Tlaloc Shrimp</strong><div class="meta">Shrimp patty, citrus, roasted chile</div></div>
          </div>
        </div>
      </div>
    </div>

    <!-- decorative fireflies (generated by JS) -->
    <div id="decor"></div>
  </div>

<script>
// small UI & visual behavior script
const root = document.documentElement;
let loop = false;
const toggle = document.getElementById('rgbToggle');
let t = 0;
let animId = null;

function stepRGB(){
  t += 0.02;
  const r = Math.round(160 + Math.sin(t*1.5)*95);
  const g = Math.round(80 + Math.cos(t*1.2)*90);
  const b = Math.round(180 + Math.sin(t*0.9)*70);
  root.style.setProperty('--r', r);
  root.style.setProperty('--g', g);
  root.style.setProperty('--b', b);
}

function startLoop(){ if(!animId){ animId = requestAnimationFrame(loopTick);} }
function stopLoop(){ if(animId){ cancelAnimationFrame(animId); animId = null;} }
function loopTick(){ stepRGB(); animId = requestAnimationFrame(loopTick); }

toggle.addEventListener('click', ()=>{
  loop = !loop;
  toggle.textContent = loop ? 'Stop RGB' : 'Loop RGB';
  if(loop) startLoop(); else stopLoop();
})

// mouse reactive tint
document.getElementById('fairy').addEventListener('mousemove', (e)=>{
  const r = 200 + Math.round((e.offsetX / e.target.clientWidth)*55);
  const g = 60 + Math.round((e.offsetY / e.target.clientHeight)*80);
  const b = 180;
  root.style.setProperty('--r', r);
  root.style.setProperty('--g', g);
  root.style.setProperty('--b', b);
});

// generate a few fireflies in different positions
const decor = document.getElementById('decor');
for(let i=0;i<12;i++){
  const f = document.createElement('div');
  f.className='firefly';
  f.style.left = (5 + Math.random()*90)+'%';
  f.style.top = (10 + Math.random()*80)+'%';
  f.style.animationDelay = (Math.random()*4)+'s';
  f.style.animationDuration = (4 + Math.random()*6)+'s';
  decor.appendChild(f);
}

// simple intersection observer to lazy-add menu items (simulating lazy load)
const menu = document.getElementById('menu');
const io = new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    if(e.isIntersecting){
      // simulate lazy load
      setTimeout(()=>{
        const extra = document.createElement('div');
        extra.className='item';
        extra.innerHTML = '<strong>Seasonal: Pibil Smash</strong><div class="meta">Slow braised cochinita, pickled onion</div>';
        menu.appendChild(extra);
        io.unobserve(e.target);
      },600);
    }
  })
},{threshold:0.2});
io.observe(menu);

// Order CTA -> quick micro interaction
document.getElementById('order').addEventListener('click', ()=>{
  const original = document.getElementById('order');
  original.textContent='Adding to cart...';
  setTimeout(()=>{ original.textContent='Added!'; original.style.boxShadow='0 8px 32px rgba(0,0,0,0.4)'; },800);
});

</script>
</body>
</html>
